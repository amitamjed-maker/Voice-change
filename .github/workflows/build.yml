name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload build artifact (for logged-in users)
        uses: actions/upload-artifact@v4
        with:
          name: voice-changer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK with version tag
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/VoiceChanger-${{ github.run_number }}.apk

      - name: Publish public Release (no login needed to download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Voice Changer build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/VoiceChanger-${{ github.run_number }}.apk
          body: |
            Automatic build from commit ${{ github.sha }}.
            Download the APK below and install it on your phone
            ("Install from unknown sources" may need to be enabled).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
